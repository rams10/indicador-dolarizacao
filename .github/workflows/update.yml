name: Atualização diária do dólar

on:
  push:
    branches:
      - main
    paths:
      - "monitor.py"
      - "docs/index.html"
      - "tests/test_monitor.py"
  schedule:
    # Dias úteis às 18:30 em Brasília (21:30 UTC).
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indicador-dolarizacao
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar cálculos do indicador
        run: python -m unittest discover -s tests -v
      - name: Consultar série diária do Banco Central e calcular indicador
        run: python monitor.py
      - name: Publicar dados do painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Atualiza indicador diário do dólar" && git push)
