name: Atualização semanal do dólar

on:
  schedule:
    # Sábado às 08:15 em Brasília (11:15 UTC).
    - cron: "15 11 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indicador-dolarizacao
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Consultar série diária do Banco Central e calcular indicador
        run: python monitor.py
      - name: Publicar dados do painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Atualiza indicador semanal do dólar" && git push)
